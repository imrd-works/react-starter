version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      lint:
        patterns: ['eslint*', '@eslint*', 'typescript-eslint', 'stylelint*', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/*', 'msw', 'jsdom']
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
